<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo do mapa -->
  <rect width="1200" height="600" fill="#3D4C4A" />
  
  <!-- Contornos simplificados dos continentes -->
  <!-- América do Norte -->
  <path d="M150,120 C180,100 220,90 250,110 C280,130 310,120 340,140 C370,160 390,180 410,160 C430,140 450,150 470,170 C490,190 510,200 530,180 C550,160 570,170 590,190 L590,300 L150,300 Z" 
        fill="#FFDD00" opacity="0.7" stroke="#fff" stroke-width="1" />
  
  <!-- América do Sul (com destaque para o Brasil) -->
  <path d="M300,320 C330,300 360,310 390,330 C420,350 450,340 480,360 C510,380 540,370 570,390 L570,500 L300,500 Z" 
        fill="#00A651" opacity="0.7" stroke="#fff" stroke-width="1" />
  
  <!-- Europa -->
  <path d="M600,100 C630,80 660,90 690,110 C720,130 750,120 780,140 C810,160 840,150 870,170 L870,280 L600,280 Z" 
        fill="#4A90E2" opacity="0.7" stroke="#fff" stroke-width="1" />
  
  <!-- Ásia -->
  <path d="M800,120 C830,100 860,110 890,130 C920,150 950,140 980,160 C1010,180 1040,170 1070,190 L1070,300 L800,300 Z" 
        fill="#8DC63F" opacity="0.7" stroke="#fff" stroke-width="1" />
  
  <!-- África -->
  <path d="M600,320 C630,300 660,310 690,330 C720,350 750,340 780,360 C810,380 840,370 870,390 L870,500 L600,500 Z" 
        fill="#999" opacity="0.5" stroke="#fff" stroke-width="1" />
  
  <!-- Oceania -->
  <path d="M900,350 C930,330 960,340 990,360 C1020,380 1050,370 1080,390 L1080,500 L900,500 Z" 
        fill="#999" opacity="0.5" stroke="#fff" stroke-width="1" />
  
  <!-- Linhas de grade -->
  <g stroke="#fff" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="900" y1="0" x2="900" y2="600" />
  </g>
</svg>
